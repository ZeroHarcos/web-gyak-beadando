  <script defer src="js/script.js"></script>
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container-fluid">
      <a class="navbar-brand" href="index.html">Filmek</a>
      <div class="collapse navbar-collapse">
        <ul class="navbar-nav me-auto">
            <li class="nav-item"><a class="nav-link" href="movies.html">Filmlista</a></li>
            <li class="nav-item"><a class="nav-link" href="form.html">Kapcsolat</a></li>
            <li class="nav-item"><a class="nav-link" href="filmek/deadpool.html">Deadpool</a></li>
            <li class="nav-item"><a class="nav-link" href="filmek/johnwick4.html">John Wick 4</a></li>
            <li class="nav-item"><a class="nav-link" href="filmek/nobody.html">Senki</a></li>
            <li class="nav-item"><a class="nav-link" href="filmek/starwars.html">Star Wars</a></li>
            <li class="nav-item"><a class="nav-link" href="filmek/elcamino.html">El Camino</a></li>
        </ul>
      </div>
    </div>
  </nav>
  <main class="container my-5">
    <h2>Kapcsolat</h2>
    <form id="contactForm">
      <div class="mb-3">
        <label for="name" class="form-label">Név</label>
        <input type="text" class="form-control" id="name" required>
      </div>
      <div class="mb-3">
        <label for="email" class="form-label">Email</label>
        <input type="email" class="form-control" id="email" required>
      </div>
      <div class="mb-3">
        <label for="movie" class="form-label">Kedvenc filmed</label>
        <input type="text" class="form-control" id="movie" required>
      </div>
      <div class="mb-3">
        <label for="genre" class="form-label">Műfaj</label>
        <select id="genre" class="form-select" required>
          <option value="">Válassz...</option>
          <option>Akció</option>
          <option>Vígjáték</option>
          <option>Dráma</option>
          <option>Horror</option>
        </select>
      </div>
      <div class="mb-3">
        <label for="message" class="form-label">Vélemény / Javaslat</label>
        <textarea id="message" class="form-control" rows="4" required></textarea>
      </div>
      <button type="submit" class="btn btn-primary">Küldés</button>
    </form>
  </main>
</body>
</html>
